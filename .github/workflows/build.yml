name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-apk
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      APP_VERSION_CODE: ${{ github.run_number }}
      APP_VERSION_NAME: 1.0.${{ github.run_number }}
      VITE_APP_VERSION: 1.0.${{ github.run_number }}
      HAS_KEYSTORE: ${{ secrets.KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install
        run: npm ci

      - name: Build web app
        run: npm run build

      - name: Sync Android project
        run: npx cap sync android

      - name: Restore signing key
        if: env.HAS_KEYSTORE == 'true'
        env:
          KS: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          CLEAN=$(printf '%s' "$KS" | tr -d ' \r\n\t')
          echo "::notice title=Secret check::length=${#CLEAN} starts=${CLEAN:0:4} ends=${CLEAN: -4}"
          printf '%s' "$CLEAN" | base64 -d > "$RUNNER_TEMP/release.p12"
          FP=$(keytool -list -v -keystore "$RUNNER_TEMP/release.p12" -storetype PKCS12 -storepass kikar-hashabbat | grep -m1 'SHA256:' | awk '{print $2}')
          echo "::notice title=Signing key::fingerprint=$FP"

      - name: Build APK
        working-directory: android
        env:
          KEYSTORE_FILE: ${{ env.HAS_KEYSTORE == 'true' && format('{0}/release.p12', runner.temp) || '' }}
          KEYSTORE_PASSWORD: kikar-hashabbat
          KEY_ALIAS: kikar
          KEY_PASSWORD: kikar-hashabbat
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Collect APK
        run: |
          ls -la android/app/build/outputs/apk/release/
          cp android/app/build/outputs/apk/release/app-release*.apk kikar-hashabbat.apk

      - name: Upload build (no signing key yet)
        if: env.HAS_KEYSTORE != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: kikar-hashabbat-unsigned
          path: kikar-hashabbat.apk

      - name: Publish release
        if: env.HAS_KEYSTORE == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v${APP_VERSION_NAME}" kikar-hashabbat.apk \
            --title "גרסה ${APP_VERSION_NAME}" \
            --notes-file RELEASE_NOTES.md \
            --latest
